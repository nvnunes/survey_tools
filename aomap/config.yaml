folder: ../data/maps
cores: 5                            #  build_inner: worker processes; append_asterism_stats: inference threads; -1: all cores
chunk_multiple: 5                   #  0: skip chunking, chunk_size = cores * chunk_multiple = number of pixels computed between updates to disk
outer_level: 6                      #  6: 55 arcmin resolution
max_data_level: 9                   #  9:  7 arcmin resolution
inner_level: 14                     # 14: 13 arcsec resolution
asterism_epoch: 2028.0              # epoch for star coordinates
prediction_wavelength: 1.654        # [micron]
seeing_reference_wavelength: 0.5    # [micron]
seeing_reference_sr: 0.0            # dimensionless
seeing_reference_ee: 0.02           # dimensionless
seeing_reference_fwhm: 650.0        # [mas] = 0.65 arcsec
coverage_ee_threshold_resolved: 0.4 # Empirically splits on-axis EE; selects strong resolved-performance regime
coverage_ee_threshold_mean: 0.3     # Empirical mean-EE floor; marks AO-present vs AO-absent regimes

#build_level: 1                     # limit building to specific level
#build_pixs: 26                     # limit building to specific pixels

ao_systems:
  # - name: GNAO-Limit
  #   rank: 3
  #   band: R
  #   fov     : 120.0 # [diameter, arcsec]
  #   fov_1ngs:  60.0 # [diameter, arcsec]
  #   min_wfs : 2
  #   max_wfs : 3
  #   min_mag :   8.0 # Vega
  #   nom_mag :  16.0 # Vega (nominal)
  #   max_mag :  18.5 # Vega
  #   min_sep :   5.0 # [arcsec]
  #   max_sep : 120.0 # [arcsec]
  # - name: GNAO-Nominal
  #   rank: 2
  #   band: R
  #   fov:      120.0 # [diameter, arcsec]
  #   fov_1ngs:  60.0 # [diameter, arcsec]
  #   min_wfs : 2
  #   max_wfs : 3
  #   min_mag :   8.0 # Vega
  #   nom_mag :  16.0 # Vega (nominal)
  #   max_mag :  17.0 # Vega
  #   min_sep :   5.0 # [arcsec]
  #   max_sep : 120.0 # [arcsec]
  # - name: GNAO-Optimal
  #   rank: 1
  #   band: R
  #   fov:      120.0 # [diameter, arcsec]
  #   fov_1ngs:  60.0 # [diameter, arcsec]
  #   min_wfs : 3
  #   max_wfs : 3
  #   min_mag :   8.0 # Vega
  #   nom_mag :  16.0 # Vega (nominal)
  #   max_mag :  16.0 # Vega
  #   min_sep :   5.0 # [arcsec]
  #   max_sep : 120.0 # [arcsec]
  #   min_rel_area: 0.50 # relative to optimal triangle area
  #   max_rel_area: 4.00 # relative to optimal triangle area
  - name: GNAO
    rank: 1
    band: R
    fov     : 120.0 # [diameter, arcsec]
    fov_1ngs:  60.0 # [diameter, arcsec]
    lgs:
      - zd: 30.0
        az: 45
      - zd: 30.0
        az: 135
      - zd: 30.0
        az: 225
      - zd: 30.0
        az: 315
    min_wfs : 2
    max_wfs : 3
    min_mag :   8.0 # Vega
    nom_mag :  16.0 # Vega
    dim_mag :  18.0 # Vega
    max_mag :  18.5 # Vega
    min_sep :   5.0 # [arcsec]
    max_sep : 120.0 # [arcsec]
    models:
      1star: ao_model_rnd_1star_expanded_mean_1024-512
      2star: ao_model_rnd_2star_expanded_mean_1024-512
      3star: ao_model_rnd_3star_expanded_mean_1024-512
    point_models:
      1star: ao_model_rnd_1star_1024-512-256
      2star: ao_model_rnd_2star_1024-512-256
      3star: ao_model_rnd_3star_1024-512-256
    rot_range: null #[0.0, 45.0] # [degrees]
    rot_step: null  #1.0 # [degrees]
max_dust_extinction: 0.3    # Av
min_ecliptic_latitude: 15.0 # degree

asterisms_min_galactic_latitude:  20.0  # degree
asterisms_galactic_latitude_bypass_pixs: [] # outer pixels that bypass the galactic-latitude exclusion
asterisms_max_star_density:        6.0  # stars/arcmin^2
asterisms_max_bright_star_mag:     8.0  # Vega
asterisms_max_overlap:             0.66 # relative to area of smaller intersecting asterism
asterisms_max_dust_extinction:     0.3  # Av
